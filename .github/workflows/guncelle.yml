name: Turnuvalari guncelle

on:
  schedule:
    - cron: "0 3,11,17 * * *"     # Turkiye saatiyle 06:00, 14:00, 20:00
  workflow_dispatch:
    inputs:
      tarama:
        description: "Taramalari calistir (false = sadece veriyi birlestir)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

# Site artik dogrudan main dalindan yayinlanir (Pages: deploy from branch).
# Bu is akisi sadece turnuva verisini toplar ve kaydeder; yayin GitHub tarafinda
# kendiliginden olur, kuyruk beklemez.
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      TARA: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tarama != 'false') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneler
        run: pip install requests beautifulsoup4 zstandard

      - name: TSF 81 il taramasi
        if: env.TARA == 'true'
        continue-on-error: true
        run: python scripts/tsf_il_tarayici.py --cikti data/tr_tarama.json

      - name: Yurt disi taramasi (MyChess.events)
        if: env.TARA == 'true'
        continue-on-error: true
        run: python scripts/yurtdisi_tarayici.py

      - name: Bulmacalar (ayda bir, Lichess CC0 veritabani)
        if: env.TARA == 'true'
        continue-on-error: true
        run: python scripts/bulmaca_indir.py

      - name: Birlestir, arsivle, bildir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scripts/birlestir.py

      - name: Veriyi kaydet
        continue-on-error: true
        run: |
          git config user.name "turnuva-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data feed.xml
          if git diff --cached --quiet; then echo "Degisiklik yok"; exit 0; fi
          git commit -m "Otomatik guncelleme $(date -u +'%Y-%m-%d %H:%M UTC')"
          for deneme in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git reset --soft origin/main; git commit -m "Otomatik guncelleme (yeniden)"; }
            if git push origin HEAD:main; then echo "Kaydedildi"; exit 0; fi
            echo "Push reddedildi, tekrar deneniyor ($deneme)"; sleep 10
          done
          echo "::warning::Veri kaydedilemedi"
