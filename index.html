<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnuva Rehberim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1a17; --bg2:#13211d; --card:#16241f; --card2:#1b2c26; --line:#243731;
  --text:#e7efeb; --muted:#8fa39b; --dim:#62766e;
  --acc:#3ddc97; --acc-ink:#062a1b; --acc-soft:rgba(61,220,151,.12);
  --warn:#e3b341; --warn-soft:rgba(227,179,65,.13);
  --red:#ef5b5b; --red-soft:rgba(239,91,91,.14);
  --blue:#6aa9ff; --blue-soft:rgba(106,169,255,.13);
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(15,26,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo-mark{width:26px;height:26px;border-radius:7px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:2px solid var(--acc)}
.logo-mark i:nth-child(1),.logo-mark i:nth-child(4){background:var(--acc)}
.search{flex:0 1 220px;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;outline:none}
.search::placeholder{color:var(--dim)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:7px 13px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-current="page"]{background:var(--acc-soft);color:var(--acc)}

main{max-width:1100px;margin:0 auto;padding:0 18px 60px}

/* hero */
.hero{text-align:center;padding:44px 0 26px}
.season{color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.04em}
.hero h1{font-size:clamp(34px,6vw,52px);font-weight:800;margin:8px 0 10px}
.hero p{color:var(--muted);max-width:560px;margin:0 auto}

/* rating dial – the one bold element */
.rating{margin:26px auto 0;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.rating label{color:var(--muted);font-weight:600}
.rating-num{width:118px;background:transparent;border:0;border-bottom:2px solid var(--acc);font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:800;color:var(--acc);text-align:center;outline:none;padding:0 2px;-moz-appearance:textfield}
.rating-num::-webkit-outer-spin-button,.rating-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{background:none;border:0;border-radius:999px;padding:5px 14px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.rating-hint{flex-basis:100%;text-align:center;color:var(--dim);font-size:13px;margin-top:-4px}

/* country grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:26px}
@media (max-width:720px){.grid{grid-template-columns:1fr}.top-in{flex-wrap:wrap}.tabs{margin-left:0;width:100%}.search{flex:1 1 auto}}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;width:100%}
.ccard:hover{border-color:#35524a}
.ccard.home{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.chead{display:flex;align-items:center;gap:12px}
.flag{width:40px;height:27px;border-radius:4px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.flag svg{display:block;width:100%;height:100%}
.cname{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;line-height:1.15}
.csub{color:var(--muted);font-size:13px}
.badge{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.live{background:var(--red-soft);color:var(--red)}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.mini li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);justify-self:center}
.dot.ok{background:var(--acc)}.dot.inv{background:var(--blue)}
.mini .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfdad5}
.mini .dt{color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
.mini .empty{color:var(--dim);display:block}
.cfoot{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:18px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* country detail */
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:18px 0 0;font-weight:600}
.back:hover{color:var(--text)}
.dhead{display:flex;align-items:center;gap:16px;padding:14px 0 6px}
.dhead .flag{width:60px;height:40px;border-radius:6px}
.dhead h1{font-size:clamp(28px,5vw,40px);font-weight:800}
.dnote{color:var(--muted);max-width:720px;margin:6px 0 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.count{margin-left:auto;color:var(--dim);font-size:13px}

.tlist{display:flex;flex-direction:column;gap:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;display:grid;grid-template-columns:92px 1fr;gap:16px}
@media (max-width:560px){.tcard{grid-template-columns:1fr}}
.when{background:var(--bg2);border-radius:var(--r-sm);padding:10px 8px;text-align:center;align-self:start}
.when .d{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;line-height:1}
.when .m{color:var(--muted);font-size:13px;font-weight:600;margin-top:3px}
.when .left{margin-top:8px;font-size:12px;color:var(--acc);font-weight:700}
@media (max-width:560px){.when{display:flex;gap:10px;align-items:baseline;text-align:left;padding:8px 12px}.when .left{margin:0 0 0 auto}}
.ttop{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.tname{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700;line-height:1.25;flex:1 1 260px}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.v{background:var(--acc-soft);color:var(--acc)}
.st.e{background:var(--warn-soft);color:var(--warn)}
.meta{color:var(--muted);font-size:14px;margin-top:3px}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sec{font-size:13px;padding:4px 10px;border-radius:var(--r-sm);background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.sec.fit{border-color:var(--acc);color:var(--acc);background:var(--acc-soft);font-weight:600}
.sec.inv{border-color:rgba(106,169,255,.4);color:var(--blue)}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;font-size:14px}
.facts b{color:var(--muted);font-weight:600}
.tnote{margin-top:10px;font-size:14px;color:#c4d1cb;background:var(--bg2);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:13px;padding:7px 12px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--text);background:var(--card2)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.emptybox{border:1px dashed var(--line);border-radius:var(--r-md);padding:26px;text-align:center;color:var(--muted)}

/* calendar */
.month{margin-top:26px}
.month h2{font-size:20px;font-weight:700;margin-bottom:10px;color:var(--muted)}
.row{display:grid;grid-template-columns:64px 40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:hover{background:var(--card)}
.row .flag{width:30px;height:20px}
.row .rd{font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc)}
.row .rn{min-width:0}
.row .rn div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rn div:last-child{font-size:13px;color:var(--muted)}

/* calculators */
.calcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}
@media (max-width:820px){.calcs{grid-template-columns:1fr}}
.calc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.calc h2{font-size:22px;font-weight:800}
.calc .sub{color:var(--muted);font-size:14px;margin:4px 0 16px}
.frow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 120px}
.field span{font-size:13px;color:var(--muted);font-weight:600}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;outline:none;width:100%}
.inp:focus{border-color:var(--acc)}
.games{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.game{display:grid;grid-template-columns:28px 1fr 130px 32px;gap:8px;align-items:center}
.game .no{color:var(--dim);font-size:13px;text-align:right}
.res{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.res button{flex:1;background:none;border:0;padding:7px 0;cursor:pointer;color:var(--muted);font-weight:700}
.res button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:18px;line-height:1}
.x:hover{color:var(--red)}
.add{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:var(--r-sm);padding:7px;width:100%;cursor:pointer;font-weight:600}
.add:hover{border-color:var(--acc);color:var(--acc)}
.out{margin-top:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.out div{background:var(--bg2);border-radius:var(--r-sm);padding:10px 12px}
.out small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.out strong{font-family:"Bricolage Grotesque",sans-serif;font-size:24px}
.out .big{grid-column:1/-1}
.out .big strong{font-size:34px}
.pos{color:var(--acc)}.neg{color:var(--red)}
.fine{color:var(--dim);font-size:13px;margin-top:12px}

/* sources */
.srcs{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.src{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px}
.src h3{font-size:17px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.src p{margin:6px 0 0;color:#c4d1cb;font-size:14px;max-width:760px}
.page-h{padding:34px 0 0}
.page-h h1{font-size:clamp(28px,5vw,40px);font-weight:800}
.page-h p{color:var(--muted);margin:6px 0 0;max-width:680px}
.findbtn{border:0;cursor:pointer}
.yg{margin-top:10px;font-size:14px;background:var(--acc-soft);color:var(--text);border:1px solid rgba(61,220,151,.35);padding:8px 12px;border-radius:var(--r-sm)}
.yg b{color:var(--acc)}
.yg.no{background:var(--bg2);border-color:var(--line);color:var(--muted)}
.sec.age{border-style:dashed}
.sect{font-size:22px;font-weight:800;margin:30px 0 12px;display:flex;gap:10px;align-items:baseline}
.sect span{font-size:15px;color:var(--muted);font-weight:600}
.ilbox{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px}
.ilbox summary{cursor:pointer;font-weight:700;font-family:"Bricolage Grotesque",sans-serif;font-size:18px}
.ilbox summary span{font-family:Figtree,sans-serif;font-size:13px;color:var(--muted);font-weight:500;margin-left:8px}
.ilgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;margin-top:12px}
.il{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;font-size:13px;cursor:pointer;color:var(--dim);text-align:left}
.il i{font-style:normal;font-weight:700}
.il.ok{color:var(--text);border-color:rgba(61,220,151,.45)}.il.ok i{color:var(--acc)}
.il.bos{color:var(--muted);border-color:#35524a}
.il.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.il.sel i{color:var(--acc-ink)}
.illeg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.illeg span{display:inline-flex;gap:6px;align-items:center}
.sq{width:10px;height:10px;border-radius:3px;border:1px solid var(--line);background:var(--bg2)}
.sq.ok{border-color:var(--acc)}.sq.bos{border-color:#5d7a71}
.st.new{background:var(--acc);color:var(--acc-ink)}
.st.done{background:var(--card2);color:var(--muted)}
.badge.new{background:var(--acc);color:var(--acc-ink)}
.noflag{display:grid;place-items:center;width:100%;height:100%;background:var(--card2);font-size:11px;font-weight:700;color:var(--muted)}
.flag img{display:block;width:100%;height:100%;object-fit:cover}
.notice{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--acc-soft);border:1px solid rgba(61,220,151,.4);border-radius:var(--r-md);padding:12px 16px;margin-top:18px}
.notice .links{margin-top:0}
.newstrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.newstrip>b{margin-right:4px}
.nchip{display:inline-flex;align-items:center;gap:8px;max-width:320px;background:var(--card);border:1px solid rgba(61,220,151,.45);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:13px}
.nchip .flag{width:22px;height:15px;border-radius:3px}
.nchip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nchip i{font-style:normal;color:var(--acc);font-weight:700;white-space:nowrap}
.nchip.more{padding:5px 12px;color:var(--muted)}
.updline{color:var(--dim);font-size:13px;text-align:center;margin-top:22px}
.st.a{background:var(--blue-soft);color:var(--blue)}
.scanbox{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;margin:14px 0;font-size:14px;color:#c4d1cb}
.scanbox>div{flex:1 1 260px}
.upl{cursor:pointer}
.quote{margin-top:8px;font-size:13px;color:var(--muted)}
.quote summary{cursor:pointer}
.quote p{margin:6px 0 0;background:var(--bg2);padding:8px 10px;border-radius:var(--r-sm)}
.trtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 10px}
.ilsearch{flex:1 1 220px;max-width:340px;padding:10px 13px;font-size:16px}
.region{margin-top:22px}
.region h2{font-size:18px;font-weight:700;color:var(--muted);margin-bottom:8px}
.region .ilgrid{margin-top:0}
.il{padding:9px 11px;font-size:14px}
.empty-note{color:var(--muted);margin-top:20px}
.ilinfo{font-size:14px;color:#c4d1cb;margin-bottom:12px}
/* profil */
.profile{margin:26px auto 0;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;text-align:left}
.pf-main{display:flex;align-items:center;gap:12px}
.pf-avatar{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:20px;font-family:"Bricolage Grotesque",sans-serif;flex:none}
.pf-avatar.sm{width:28px;height:28px;font-size:14px}
.pf-name{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:700}
.pf-sub{color:var(--muted);font-size:13px}
.ttl{display:inline-block;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:12px;padding:1px 6px;border-radius:5px;margin-right:2px}
.pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
@media (max-width:520px){.pf-stats{grid-template-columns:repeat(2,1fr)}}
.pf-stats>div{background:var(--bg2);border-radius:var(--r-sm);padding:8px 10px;position:relative}
.pf-stats small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.pf-stats b{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;color:var(--acc)}
.pf-stats i{position:absolute;right:8px;top:8px;font-style:normal;font-size:11px;color:var(--dim)}
.pf-ukd{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--dim);font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:700;color:var(--acc);outline:none;padding:0;-moz-appearance:textfield}
.pf-ukd::-webkit-outer-spin-button,.pf-ukd::-webkit-inner-spin-button{-webkit-appearance:none}
.pf-actions{display:flex;flex-wrap:wrap;gap:8px}
.pf-actions .btn,.pbar .btn{cursor:pointer}
.profile.setup label{font-weight:700;font-family:"Bricolage Grotesque",sans-serif;font-size:18px}
.pf-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pf-row .inp{flex:1 1 140px}
.pf-in{font-size:16px;padding:10px 12px}
.pf-row .btn{border:0;cursor:pointer}
.pf-hint{color:var(--dim);font-size:13px;margin-top:6px}
.pf-res{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pf-hit{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;cursor:pointer;text-align:left}
.pf-hit:hover{border-color:var(--acc)}
.pf-hit .yr{color:var(--dim);font-size:13px}
.pf-hit .rt{font-weight:700;color:var(--acc)}
.pf-hit .rt small{color:var(--dim);font-weight:500}
.pf-none{color:var(--muted);font-size:14px}
.pf-manual{margin-top:12px;font-size:14px;color:var(--muted)}
.pf-manual summary{cursor:pointer}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;margin-top:18px;font-size:14px}
.pbar>span:nth-child(2){flex:1}
.btn.sm{padding:4px 10px;font-size:12px}
/* canlı */
.tab-live{display:inline-flex;align-items:center;gap:6px}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.live{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:4px;margin-right:6px}
.bcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.bc:hover{border-color:var(--acc)}
.bc-img{aspect-ratio:2/1;background:var(--bg2);display:grid;place-items:center;font-size:40px;color:var(--dim);overflow:hidden}
.bc-img img{width:100%;height:100%;object-fit:cover}
.bc-body{padding:10px 12px}
.bc-meta{font-size:12px;color:var(--muted)}
.bc-name{font-weight:700;margin-top:3px;line-height:1.3}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:8px}
.lhead h1{font-size:clamp(22px,4vw,32px);font-weight:800}
.rsel{max-width:240px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.mcard:hover{border-color:var(--acc)}
.mcard.trg{border-color:rgba(239,91,91,.55)}
.pl{display:flex;align-items:center;gap:5px;font-size:13px;min-width:0}
.pl>*:not(.pn){flex:none}
.mcard .pl .ttl{font-size:10px;padding:0 4px}
.mcard .pl .fed{display:none}
.mcard .pl .fed.tr{display:inline-flex}
.pl .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;flex:1;min-width:0}
.pl .pr{color:var(--muted)}
.pl .fed{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--dim);font-weight:700}
.pl .fed svg{width:14px;height:10px;border-radius:2px}
.pl .fed.tr{color:var(--red)}
.pl .clk{font-variant-numeric:tabular-nums;background:var(--bg2);padding:1px 6px;border-radius:4px;font-size:12px}
.pl .clk.on{background:var(--acc);color:var(--acc-ink)}
.pl .clk.on.az{background:var(--red);color:#fff}
.pl .pts{font-weight:800;color:var(--acc)}
.board{display:grid;gap:0;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;width:100%;border-radius:3px;overflow:hidden;user-select:none;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.bsq{position:relative;min-width:0;margin:0;padding:0;border:0}
.board.bmini .rk,.board.bmini .fl{display:none}
.bsq.lt{background:#f0d9b5}.bsq.dk{background:#b58863}
.bsq.lm::before{content:"";position:absolute;inset:0;background:rgba(155,199,0,.41)}
.bsq.chk{background-image:radial-gradient(ellipse at center,#ff0000 0%,#e70000 25%,rgba(169,0,0,0) 89%,rgba(158,0,0,0) 100%)}
.bsq.sel::before{content:"";position:absolute;inset:0;background:rgba(20,85,30,.5)}
.bsq.dot::after{content:"";position:absolute;inset:38%;border-radius:50%;background:rgba(20,85,30,.5);z-index:2}
.bsq.cap::after{content:"";position:absolute;inset:0;background:radial-gradient(transparent 0%,transparent 79%,rgba(20,85,30,.3) 80%);z-index:2}
.bsq img{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.bsq .rk,.bsq .fl{position:absolute;font-style:normal;font-size:10px;font-weight:700;z-index:1;line-height:1}
.bsq .rk{left:2px;top:2px}.bsq .fl{right:2px;bottom:2px}
.bsq.lt .rk,.bsq.lt .fl{color:#b58863}.bsq.dk .rk,.bsq.dk .fl{color:#f0d9b5}
.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,1fr);gap:18px;margin-top:14px}
@media (max-width:860px){.game{grid-template-columns:1fr}}
.gboard{display:flex;gap:8px}
.evalbar{width:18px;flex:none;background:#333;border-radius:4px;position:relative;overflow:hidden;align-self:stretch}
.evalbar #evalfill{position:absolute;left:0;right:0;bottom:0;background:#f2f2f2;transition:height .4s}
.evalbar span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:10px;font-weight:800;color:#888;white-space:nowrap;text-align:center}
.gcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}

.eline .dep{color:var(--dim);font-size:12px;margin-right:6px}
.moves{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;max-height:340px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:2px 4px;align-content:flex-start}

.moves .res{width:100%;text-align:center;font-weight:800;margin-top:6px}

.deneme{background:var(--warn-soft);border-radius:var(--r-sm);padding:8px 10px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.profile.quick{padding:14px 18px}
.pq-title{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;margin-bottom:8px}
.pq-row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.pq-f{flex:1 1 120px;display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px}

.pq-f input::-webkit-outer-spin-button,.pq-f input::-webkit-inner-spin-button{-webkit-appearance:none}
.pq-f input::placeholder{font-size:14px;font-weight:500;color:var(--dim)}
.pq-row .btn{border:0;cursor:pointer}
.pf-hint a{color:var(--muted)}
.bchips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:thin}
.bchip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.bchip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}

/* ---------- otomatik veri (data/turnuvalar.json, GitHub Actions günceller) ---------- */
let META = null;
const BAYRAK = {TR:'tr',ES:'es',SE:'se',EN:'gb-eng',DE:'de',IT:'it',NL:'nl',CZ:'cz',IS:'is',CH:'ch',GE:'ge',GR:'gr'};
function flag(code){
  if(FLAGS[code]) return FLAGS[code];
  if(BAYRAK[code]) return `<img src="https://flagcdn.com/${BAYRAK[code]}.svg" alt="" loading="lazy">`;
  return `<span class="noflag">${esc(code)}</span>`;
}
function veriyiUygula(v){
  if(!v || !Array.isArray(v.turnuvalar) || !v.turnuvalar.length) return false;
  META = v;
  T = v.turnuvalar.map(t=>({...t, city:t.city||t.il||'', sections:(t.sections&&t.sections.length)?t.sections:[{n:'Genel',min:null,max:null}],
    alinti:t.alinti||t.kaynak_metin||'',
    note:t.note || (t.kaynak==='site'||t.kaynak==='takvim' ? `${t.reyting_turu?t.reyting_turu+' turnuvası. ':''}Bilgiler TSF il sayfasındaki duyurudan otomatik çıkarıldı; kesin bilgi yönergede.`
                  : t.kaynak==='mychess' ? `MyChess.events üzerinden otomatik eklendi.${t.kayit_kapali?' Kayıtlar kapanmış.':''}` : '')}));
  // yeni ülkeler kendiliğinden eklenir
  const bilinen = new Set(COUNTRIES.map(c=>c.code));
  const yeni = {};
  T.forEach(t=>{ if(t.bayrak && !BAYRAK[t.c]) BAYRAK[t.c]=t.bayrak;
    if(!bilinen.has(t.c)){ (yeni[t.c]=yeni[t.c]||{code:t.c,name:t.ulke||t.c,sehir:{},auto:true}); if(t.city) yeni[t.c].sehir[t.city]=(yeni[t.c].sehir[t.city]||0)+1; }});
  Object.values(yeni).forEach(c=>{ c.sub=Object.entries(c.sehir).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(', ')||'';
    c.note='Bu ülke yeni bir turnuva ilan edildiği için otomatik olarak eklendi.'; COUNTRIES.push(c); });
  // il durumları
  (v.iller||[]).forEach(r=>{ if(r.durum==='ok') IL_DURUM[r.il] = T.some(t=>t.il===r.il&&D(t.end)>=today)?'ok':'bos'; });
  return true;
}
const gunFark = (a,b)=>Math.round((D(a)-D(b))/864e5);
const bugunS = ()=>{const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function yeniMi(t){ return META && t.ilk_gorulme && META.ilk_kurulum && t.ilk_gorulme>META.ilk_kurulum && gunFark(bugunS(),t.ilk_gorulme)<=7 && D(t.end)>=today; }
const arsiv = () => T.filter(t=>D(t.end)<today).sort((a,b)=>D(b.end)-D(a.end));
function fmtZaman(s){ if(!s) return '–'; const d=new Date(s.length<=16?s+':00':s); if(isNaN(d)) return s;
  return `${d.getDate()} ${AYU[d.getMonth()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function guncellemeKutusu(sade){
  if(!META) return `<div class="scanbox"><div><b>Otomatik güncelleme</b> Veri dosyasına ulaşılamadı; şu an yerleşik liste gösteriliyor.</div></div>`;
  const k=META.kaynaklar||{};
  return `<div class="scanbox"><div><b>Otomatik güncelleniyor</b> Son güncelleme ${fmtZaman(META.guncelleme)}.${sade?'':` TSF 81 il taraması: ${fmtZaman(k.tsf&&k.tsf.tarama)} (${(k.tsf&&k.tsf.il_sayisi)||0} il). Yurt dışı: ${fmtZaman(k.yurtdisi&&k.yurtdisi.tarama)}.`}</div>
    <a class="btn" href="feed.xml" target="_blank" rel="noopener">RSS ile takip et</a></div>`;
}
/* son ziyaretten beri ne değişti */
let ZIYARET = null;
function ziyaretHesapla(){
  let son=null; try{ son=localStorage.getItem('tr-son-ziyaret'); }catch(e){}
  const b=bugunS();
  if(son && son<b && META){
    const yeni=T.filter(t=>t.ilk_gorulme && t.ilk_gorulme>son && D(t.end)>=today);
    const oynandi=T.filter(t=>t.end>=son && t.end<b);
    if(yeni.length||oynandi.length) ZIYARET={son, yeni, oynandi};
  }
  try{ localStorage.setItem('tr-son-ziyaret', b); }catch(e){}
}
function ziyaretBandi(){
  if(!ZIYARET) return '';
  const {yeni,oynandi}=ZIYARET;
  return `<div class="notice" role="status">
    <div><b>Son ziyaretinden beri:</b> ${yeni.length?`${yeni.length} yeni turnuva eklendi`:''}${yeni.length&&oynandi.length?', ':''}${oynandi.length?`${oynandi.length} turnuva oynandı ve arşive taşındı`:''}.</div>
    <div class="links">${yeni.length?'<button class="btn pri" data-view-go="yeni">Yenileri gör</button>':''}${oynandi.length?'<button class="btn" data-view-go="arsiv">Arşiv</button>':''}<button class="btn" id="noticeclose" aria-label="Kapat">✕</button></div>
  </div>`;
}

/* ---------- helpers ---------- */
const AY = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const AYU = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const D = s => new Date(s+'T12:00:00');
const today = new Date(); today.setHours(0,0,0,0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtRange(a,b){const x=D(a),y=D(b);
  if(x.getMonth()===y.getMonth()&&x.getFullYear()===y.getFullYear()) return `${x.getDate()}–${y.getDate()} ${AYU[x.getMonth()]} ${x.getFullYear()}`;
  return `${x.getDate()} ${AYU[x.getMonth()]}${x.getFullYear()!==y.getFullYear()?' '+x.getFullYear():''} – ${y.getDate()} ${AYU[y.getMonth()]} ${y.getFullYear()}`;}
function daysLeft(t){const s=D(t.start),e=D(t.end);
  if(e<today) return null;
  if(s<=today) return 'Şu an oynanıyor';
  const n=Math.round((s-today)/864e5); return n===1?'Yarın':`${n} gün kaldı`;}
const fitSecs = (t,r)=>t.sections.filter(s=>secState(s,r)==='fit');
const upcoming = () => T.filter(t=>D(t.end)>=today).sort((a,b)=>D(a.start)-D(b.start));
function secState(s,r){ if(s.inv) return 'inv'; if(s.age) return 'age'; if(!r) return '';
  return ((s.min==null||r>=s.min)&&(s.max==null||r<=s.max))?'fit':''; }
function fits(t,r){ return t.sections.some(s=>secState(s,r)==='fit'); }
function secLabel(s){ if(s.inv||s.age) return s.n;
  if(s.min!=null&&s.max!=null) return `${s.n} (${s.min}–${s.max})`;
  if(s.min!=null) return `${s.n} (${s.min} ve üstü)`;
  if(s.max!=null) return `${s.n} (${s.max} ve altı)`;
  return `${s.n} (herkese açık)`;}
function hotelUrl(t){const q=encodeURIComponent((t.city||t.il||'').split('(')[0].trim());
  return `https://www.booking.com/searchresults.html?ss=${q}&checkin=${t.start}&checkout=${t.end}`;}

function profilUygula(){
  const p=PROFIL||{};

  state.type = p.elo ? 'ELO' : 'UKD';
}
function profilKaydet(p){ PROFIL=p; try{ localStorage.setItem('tr-profil', JSON.stringify(p)); }catch(e){} profilUygula();
  try{ if(p){ if(p.elo) calc.elo.r=p.elo; if(p.ukd) calc.ukd.r=p.ukd; } }catch(e){} }

/* Türkiye'de kategori genelde en yüksek kuvvet puanına (ELO/UKD) göre; yurt dışında FIDE ELO */
function effRating(t){
  const p=PROFIL||{};
  if(t.c==='TR') return Math.max(p.elo||0, p.ukd||0);
  return p.elo||0;
}
function reytingEtiketi(t){
  const p=PROFIL||{};
  if(t.c!=='TR') return `${p.elo} ELO`;
  return (p.ukd||0)>(p.elo||0) ? `${p.ukd} UKD` : `${p.elo} ELO`;
}

/* FIDE Türkiye listesi: data/fide/tur_<harf>.json (GitHub her hafta günceller) */
const FIDE_CACHE = {};
const katla = s => (s||'').replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase()
  .replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').trim();
async function fideAra(sorgu){
  const kel = katla(sorgu).split(/\s+/).filter(w=>w.length>=2);
  if(!kel.length) return [];
  const harfler=[...new Set(kel.map(w=>w[0]))].slice(0,4);
  const listeler = await Promise.all(harfler.map(async h=>{
    if(!FIDE_CACHE[h]){ const r=await fetch(`data/fide/tur_${h}.json`,{cache:'force-cache'}); FIDE_CACHE[h]= r.ok? await r.json() : []; }
    return FIDE_CACHE[h];
  }));
  const gorulen=new Set(), out=[];
  listeler.flat().forEach(k=>{
    if(gorulen.has(k[0])) return;
    const ad=katla(k[1]).split(/\s+/);
    if(kel.every(w=>ad.some(a=>a.startsWith(w)))){ gorulen.add(k[0]); out.push(k); }
  });
  return out.sort((a,b)=>(b[3]||0)-(a[3]||0)).slice(0,12);
}
/* kayıt: [fideId, "Soyad, Ad", unvan, standart, hızlı, yıldırım, doğum yılı, cinsiyet, K] */
function fideAdi(n){ const [s,a]=String(n).split(','); return a? `${a.trim()} ${s.trim()}` : n; }
const UNVAN={GM:'GM',IM:'IM',FM:'FM',CM:'CM',WGM:'WGM',WIM:'WIM',WFM:'WFM',WCM:'WCM',g:'GM',m:'IM',f:'FM',c:'CM',wg:'WGM',wm:'WIM',wf:'WFM',wc:'WCM'};

function bindRating(){
  const e=document.getElementById('pfelo'), u=document.getElementById('pfukd');
  if(!e) return;
  const kaydet=()=>{ profilKaydet({...(PROFIL||{}), elo:parseInt(e.value)||0, ukd:parseInt(u.value)||0}); renderBody(); };
  [e,u].forEach(i=>{ i.oninput=kaydet; i.onkeydown=ev=>{ if(ev.key==='Enter'){ kaydet(); go('match'); } }; });
  document.getElementById('pfbul').onclick=()=>{ kaydet(); go('match'); };
}

  if(view==='canli' && CANLI.seg && !CANLI.zaman){ const s=CANLI.seg; setTimeout(()=> CANLI.mod==='oyun' ? canliOyunAc(CANLI.secili) : canliTurAc(`${LI}/broadcast/${s.tslug}/${s.rslug}/${s.rid}`),0); }
  state.view=view;state.country=country||null;render();window.scrollTo({top:0});}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.view));
document.getElementById('logo').onclick=()=>go('home');
document.getElementById('q').oninput=e=>{state.q=e.target.value.trim().toLocaleLowerCase('tr'); if(state.view!=='home'&&state.view!=='country'&&state.view!=='calendar') state.view='calendar'; render();};

function matchQ(t){ if(!state.q) return true; const c=COUNTRIES.find(x=>x.code===t.c);
  return (t.name+' '+(t.city||'')+' '+(t.il||'')+' '+(c?c.name:'')).toLocaleLowerCase('tr').includes(state.q); }

function homeCards(){
  const up=upcoming().filter(matchQ);
  return COUNTRIES.map(c=>{

    if((state.q||c.auto) && !list.length) return '';
    const fitN=list.filter(t=>fits(t,effRating(t))).length;
    const items=list.slice(0,4).map(t=>{
      const st=t.sections.every(s=>s.inv)?'inv':(fits(t,effRating(t))?'ok':'');
      const d=D(t.start);
      return `<li><span class="dot ${st}"></span><span class="nm">${esc(t.name)}</span><span class="dt">${d.getDate()} ${AY[d.getMonth()]}</span></li>`;}).join('')

}

  return `<div class="yg no">${reytingEtiketi(t)} için uygun grup yok.</div>`;

  return `<article class="tcard">
    <div class="when"><div class="d">${d.getDate()}</div><div class="m">${AY[d.getMonth()]} ${d.getFullYear()}</div>${left?`<div class="left">${left}</div>`:''}</div>

      <div class="ttop"><h3 class="tname">${esc(t.name)}</h3>${gecti?'<span class="st done">Oynandı</span>':`${yeniMi(t)?'<span class="st new">Yeni</span>':''}<span class="st ${t.status}">${t.status==='v'?'Tarih doğrulandı':t.status==='a'?'Otomatik bulundu':'Tahmini tarih'}</span>`}</div>
      <div class="meta">${withCountry?esc(c.name)+', ':''}${t.c==='TR'&&t.il&&!(t.city||'').startsWith(t.il)&&t.il!=='Türkiye geneli'?esc(t.il)+(t.city?', ':''):''}${esc(t.city)}, ${fmtRange(t.start,t.end)}</div>
      ${t.tarih_degisti&&!gecti?`<div class="tnote">📅 Tarih değişti: ${esc(t.tarih_degisti.split(' → ').map(x=>{const q=D(x);return q.getDate()+' '+AYU[q.getMonth()];}).join(' → '))}</div>`:''}
      ${gecti?'':yourGroup(t)}
      <div class="secs">${secs}</div>
      ${facts?`<div class="facts">${facts}</div>`:''}
      ${t.hotel?`<div class="tnote" style="border-left-color:var(--acc)">🏨 ${esc(t.hotel)}</div>`:''}
      ${t.note?`<div class="tnote">${esc(t.note)}</div>`:''}
      ${t.alinti?`<details class="quote"><summary>Duyuru metninden</summary><p>${esc(t.alinti)}</p></details>`:''}
      <div class="links">
        ${gecti&&t.cr?`<a class="btn pri" href="${esc(t.cr)}" target="_blank" rel="noopener">Sonuçlar (chess-results)</a>`:''}
        <a class="btn ${gecti&&t.cr?'':'pri'}" href="${esc(t.url)}" target="_blank" rel="noopener">Resmi sayfa</a>
        ${!gecti&&t.cr?`<a class="btn" href="${esc(t.cr)}" target="_blank" rel="noopener">Katılımcılar / eşlendirme</a>`:''}
        ${t.src&&t.src!==t.url?`<a class="btn" href="${esc(t.src)}" target="_blank" rel="noopener">Kaynak</a>`:''}
        ${!gecti&&(t.c!=='TR'||!t.sections.every(s=>s.inv))?`<a class="btn" href="${hotelUrl(t)}" target="_blank" rel="noopener">Bu tarihlerde otel ara</a>`:''}
      </div>
    </div>
  </article>`;
}

  if(state.onlyFit) list=list.filter(t=>fits(t,effRating(t)));
  if(!list.length && state.il) return {list, html:`<div class="emptybox">${esc(state.il)} için yaklaşan turnuva kaydı yok.</div>`};
  return {list, html: list.length?list.map(t=>tCard(t)).join(''):`<div class="emptybox">${state.onlyFit?'Bu ülkede reytingine uygun grubu olan turnuva yok. Filtreyi kapatıp tüm listeye bakabilirsin.':'Bu ülke için yaklaşan turnuva eklenmedi.'}</div>`};

  if(!list.length) return '<div class="emptybox" style="margin-top:20px">Aramana uyan turnuva yok.</div>';
  const groups={};
  list.forEach(t=>{const d=D(t.start),k=d.getFullYear()*100+d.getMonth();(groups[k]=groups[k]||[]).push(t);});
  return Object.keys(groups).sort().map(k=>{const y=Math.floor(k/100),m=k%100;
    return `<section class="month"><h2>${AYU[m]} ${y}</h2>${groups[k].map(t=>{
      const c=COUNTRIES.find(x=>x.code===t.c),d=D(t.start),e=D(t.end);

}

/* ---------- calculators ---------- */
const calc = {
  elo:{r:(PROFIL&&PROFIL.elo)||2000,k:[40,20,10].includes(+(PROFIL&&PROFIL.k))?+PROFIL.k:20,games:[{o:2050,s:1},{o:1980,s:.5},{o:2100,s:0}]},
  ukd:{r:(PROFIL&&PROFIL.ukd)||1600,k:20,games:[{o:1650,s:1},{o:1550,s:.5}]}
};
function expected(r,o){let d=o-r; if(d>400)d=400; if(d<-400)d=-400; return 1/(1+Math.pow(10,d/400));}
function perf(games){ if(!games.length) return null;
  const avg=games.reduce((a,g)=>a+g.o,0)/games.length, p=games.reduce((a,g)=>a+g.s,0)/games.length;
  let dp; if(p>=1) dp=800; else if(p<=0) dp=-800; else dp=Math.max(-800,Math.min(800,-400*Math.log10(1/p-1)));
  return Math.round(avg+dp);}
function calcCard(id,title,sub,kOpts,fine){
  const c=calc[id];
  return `<section class="calc" id="c-${id}"><h2>${title}</h2><p class="sub">${sub}</p>
    <div class="frow">
      <label class="field"><span>Mevcut reyting</span><input class="inp" type="number" data-f="r" value="${c.r}"></label>
      <label class="field"><span>K katsayısı</span><select class="inp" data-f="k">${kOpts.map(([v,l])=>`<option value="${v}" ${+v===c.k?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <div class="games">${c.games.map((g,i)=>`<div class="game"><span class="no">${i+1}.</span>
      <input class="inp" type="number" data-g="${i}" value="${g.o}" aria-label="${i+1}. rakip reytingi" placeholder="Rakip reytingi">
      <div class="res" role="group" aria-label="Sonuç">${[[1,'1'],[.5,'½'],[0,'0']].map(([v,l])=>`<button data-gi="${i}" data-s="${v}" aria-pressed="${g.s===v}">${l}</button>`).join('')}</div>
      <button class="x" data-del="${i}" aria-label="${i+1}. maçı sil">×</button></div>`).join('')}</div>
    <button class="add" data-add>+ Maç ekle</button>
    <div class="out" data-out></div>
    <p class="fine">${fine}</p></section>`;
}
function calcOut(id){
  const c=calc[id], el=document.querySelector(`#c-${id} [data-out]`); if(!el) return;
  const g=c.games.filter(x=>x.o>0);
  const E=g.reduce((a,x)=>a+expected(c.r,x.o),0), S=g.reduce((a,x)=>a+x.s,0), d=c.k*(S-E);
  const p=perf(g);
  el.innerHTML=`<div class="big"><small>Reyting değişimi</small><strong class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${d.toFixed(1)}</strong></div>
    <div><small>Yeni reyting</small><strong>${Math.round(c.r+d)}</strong></div>
    <div><small>Puan / beklenen</small><strong>${S} / ${E.toFixed(2)}</strong></div>
    <div><small>Performans (yaklaşık)</small><strong>${p??'–'}</strong></div>
    <div><small>Maç sayısı</small><strong>${g.length}</strong></div>`;
}
function viewCalc(){
  return `<div class="page-h"><h1>Hesaplayıcılar</h1><p>Turnuva öncesinde hedefini, sonrasında kazancını hesapla. Rakip reytinglerini gir, sonucu seç.</p></div>
  <div class="calcs">
    ${calcCard('elo','FIDE ELO','Standart FIDE formülü: değişim = K × (puan − beklenen puan). 400 puan kuralı uygulanır.',
      [[40,'40 (yeni oyuncu / 18 yaş altı ve 2300 altı)'],[20,'20 (2400 altı)'],[10,'10 (2400’e ulaşmış)']],
      'Beklenen puan FIDE tablosunun formül karşılığıyla hesaplanır, resmi tablodan ±0,01 sapabilir.')}
    ${calcCard('ukd','UKD','TSF’nin ulusal kuvvet derecesi. Aynı beklenen puan mantığıyla çalışır.',
      [[40,'40'],[30,'30'],[20,'20'],[15,'15'],[10,'10']],
      'UKD’de K katsayısı oyuncunun maç sayısı ve derecesine göre TSF UKD yönergesinde belirlenir; kendi K değerini <a href="http://ukd.tsf.org.tr/" target="_blank" rel="noopener">UKD Bilgi Sistemi</a>’nden kontrol edip seç.')}
  </div>`;
}
function bindCalc(){
  ['elo','ukd'].forEach(id=>{
    const root=document.getElementById('c-'+id), c=calc[id];
    root.addEventListener('input',e=>{const t=e.target;
      if(t.dataset.f==='r'){c.r=+t.value||0;} else if(t.dataset.f==='k'){c.k=+t.value;} else if(t.dataset.g!=null){c.games[+t.dataset.g].o=+t.value||0;}
      calcOut(id);});
    root.addEventListener('change',e=>{if(e.target.dataset.f==='k'){c.k=+e.target.value;calcOut(id);}});
    root.addEventListener('click',e=>{const t=e.target.closest('button'); if(!t) return;
      if(t.dataset.gi!=null){c.games[+t.dataset.gi].s=+t.dataset.s; rerenderCalc(id);}
      else if(t.dataset.del!=null){c.games.splice(+t.dataset.del,1); rerenderCalc(id);}
      else if(t.hasAttribute('data-add')){c.games.push({o:c.games.length?c.games[c.games.length-1].o:c.r,s:.5}); rerenderCalc(id,true);}
    });
    calcOut(id);
  });
}
function rerenderCalc(id,focusLast){
  const html=viewCalc(); const tmp=document.createElement('div'); tmp.innerHTML=html;
  document.getElementById('c-'+id).replaceWith(tmp.querySelector('#c-'+id));
  const root=document.getElementById('c-'+id); const c=calc[id];
  // re-bind only this card
  root.addEventListener('input',e=>{const t=e.target;
    if(t.dataset.f==='r'){c.r=+t.value||0;} else if(t.dataset.g!=null){c.games[+t.dataset.g].o=+t.value||0;} calcOut(id);});
  root.addEventListener('change',e=>{if(e.target.dataset.f==='k'){c.k=+e.target.value;calcOut(id);}});
  root.addEventListener('click',e=>{const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.gi!=null){c.games[+t.dataset.gi].s=+t.dataset.s; rerenderCalc(id);}
    else if(t.dataset.del!=null){c.games.splice(+t.dataset.del,1); rerenderCalc(id);}
    else if(t.hasAttribute('data-add')){c.games.push({o:c.games.length?c.games[c.games.length-1].o:c.r,s:.5}); rerenderCalc(id,true);} });
  calcOut(id);
  if(focusLast){const ins=root.querySelectorAll('[data-g]'); ins[ins.length-1]?.focus();}
}

/* ---------- sources ---------- */
/* ================= CANLI: Lichess yayınları, kendi tahtamız ve Stockfish analizi ================= */
const LI = 'https://lichess.org';
const CANLI = { mod:'liste', liste:null, hata:'', yukleniyor:false, tur:null, turlar:null, oyunlar:[], seg:null,
  secili:null, poz:null, ply:0, takip:true, sadeceTR:false, trOnce:true, flip:false, deneme:null, secKare:null,
  zaman:null, motorAcik:true, analiz:null, sonGuncelleme:null };

function canliDurdur(){ if(CANLI.zaman){ clearInterval(CANLI.zaman); CANLI.zaman=null; }
  if(CANLI.tik){ clearInterval(CANLI.tik); CANLI.tik=null; } motorDur(); }
function saatBaslat(){ if(!CANLI.tik) CANLI.tik=setInterval(()=>{ if(!document.hidden) saatTik(); },1000); }

async function canliJson(url){
  const r = await fetch(url, {headers:{Accept:'application/json'}});
  if(!r.ok) throw new Error(r.status===429?'Lichess çok sık istek nedeniyle bir süre bekletiyor, biraz sonra tekrar dene.':'Lichess yanıt vermedi ('+r.status+').');
  return r.json();
}
function turunRaundu(x){
  if(x.round) return x.round;
  const rs=x.rounds||[];
  return rs.find(r=>r.ongoing) || rs.find(r=>r.id===x.defaultRoundId) || rs[rs.length-1] || null;
}
function raundUrl(x){ const r=turunRaundu(x); if(!r) return x.tour&&x.tour.url;
  return r.url || `${LI}/broadcast/${x.tour.slug}/${r.slug}/${r.id}`; }

async function canliListeGetir(){
  CANLI.yukleniyor=true; CANLI.hata=''; render();
  try{ CANLI.liste = await canliJson(`${LI}/api/broadcast/top?page=1`);
    const ilk=(CANLI.liste.active||[])[0];
    if(ilk && CANLI.mod==='liste' && state.view==='canli'){ CANLI.yukleniyor=false; return canliTurAc(raundUrl(ilk)); } }
  catch(e){ CANLI.hata = e.message && !/fetch/i.test(e.message) ? e.message : 'Lichess’e bağlanılamadı. (Claude önizlemesinde canlı veri çalışmaz; GitHub’daki sitende çalışır.)'; }
  CANLI.yukleniyor=false; if(state.view==='canli') render();
}

/* lichess.org/broadcast/<tur>/<raund>/<raundId>[/<oyunId>] */
function yayinLinkiCoz(url){
  const m=String(url).match(/lichess\.org\/broadcast\/([^/?#]+)\/([^/?#]+)\/([A-Za-z0-9]{8})(?:\/([A-Za-z0-9]{8}))?/);
  return m ? {tslug:m[1], rslug:m[2], rid:m[3], gid:m[4]||null} : null;
}
async function canliTurAc(url, oyunId){
  const s=yayinLinkiCoz(url); if(!s){ alert('Bu bir Lichess yayın linki gibi görünmüyor.'); return; }
  if(!CANLI.liste) canliJson(`${LI}/api/broadcast/top?page=1`).then(v=>{ CANLI.liste=v; if(CANLI.mod==='tur') render(); }).catch(()=>{});
  CANLI.seg=s; CANLI.mod='tur'; CANLI.tur=null; CANLI.oyunlar=[]; CANLI.turlar=null; CANLI.hata=''; CANLI.yukleniyor=true;
  canliDurdur(); render(); window.scrollTo({top:0});
  await canliTurYenile();
  CANLI.yukleniyor=false;
  const gid = oyunId || s.gid;
  if(gid && CANLI.oyunlar.some(g=>g.id===gid)) return canliOyunAc(gid);
  render();
  CANLI.zaman=setInterval(()=>{ if(!document.hidden) canliTurYenile().then(()=>{ if(CANLI.mod==='tur') renderCanliGovde(); }); }, 15000);
  if(CANLI.tur && CANLI.tur.tour && CANLI.tur.tour.id){
    canliJson(`${LI}/api/broadcast/${CANLI.tur.tour.id}`).then(v=>{ CANLI.turlar=v.rounds||null; if(CANLI.mod==='tur') render(); }).catch(()=>{});
  }
}
async function canliTurYenile(){
  const s=CANLI.seg;
  try{
    const v=await canliJson(`${LI}/api/broadcast/${s.tslug}/${s.rslug}/${s.rid}`);
    CANLI.tur=v; CANLI.oyunlar=v.games||[]; CANLI.hata=''; CANLI.sonGuncelleme=new Date(); CANLI.saatAn=Date.now();
  }catch(e){ CANLI.hata=e.message; }
}

/* ---------- PGN ---------- */
function pgnCoz(pgn){
  const bas={}; pgn.replace(/\[(\w+)\s+"([^"]*)"\]/g,(_,k,v)=>{bas[k]=v;});
  const govde=pgn.replace(/\[(\w+)\s+"([^"]*)"\]\s*/g,'');
  const oyun=new Chess(bas.FEN||undefined);
  const poz=[{fen:oyun.fen(), san:null, uci:null, clk:null}];
  const tok=govde.match(/\{[^}]*\}|\([^()]*\)|\$\d+|\d+\.(?:\.\.)?|1-0|0-1|1\/2-1\/2|\*|[^\s{}()]+/g)||[];
  let derinlik=0;
  for(const t of tok){
    if(t[0]==='{'){ const c=t.match(/\[%clk\s+([\d:]+)/); if(c&&poz.length>1) poz[poz.length-1].clk=c[1]; continue; }
    if(t[0]==='('||t[0]==='$'||/^\d+\.(\.\.)?$/.test(t)||/^(1-0|0-1|1\/2-1\/2|\*)$/.test(t)) continue;
    const m=oyun.move(t.replace(/[?!]+$/,''),{sloppy:true});
    if(!m) break;
    poz.push({fen:oyun.fen(), san:m.san, uci:m.from+m.to, clk:null, check:oyun.in_check()});
  }
  return {bas, poz, sonuc:bas.Result||'*'};
}

async function canliOyunAc(gid){
  CANLI.mod='oyun'; CANLI.secili=gid; CANLI.poz=null; CANLI.deneme=null; CANLI.secKare=null; CANLI.takip=true; CANLI.analiz=null;
  canliDurdur(); render(); window.scrollTo({top:0});
  await canliPgnYenile(true);
  CANLI.zaman=setInterval(async()=>{ if(document.hidden) return;
    await Promise.all([canliTurYenile(), canliPgnYenile(false)]); if(CANLI.mod==='oyun') renderCanliGovde(); }, 10000);
}
async function canliPgnYenile(ilk){
  const s=CANLI.seg, gid=CANLI.secili;
  try{
    const r=await fetch(`${LI}/api/study/${s.rid}/${gid}.pgn?clocks=true&comments=false&variations=false`);
    if(!r.ok) throw new Error('PGN alınamadı ('+r.status+')');
    const p=pgnCoz(await r.text());
    const sondaydi = !CANLI.poz || CANLI.ply>=CANLI.poz.poz.length-1;
    CANLI.poz=p;
    if(ilk || (CANLI.takip && sondaydi && !CANLI.deneme)) CANLI.ply=p.poz.length-1;
    CANLI.hata='';
  }catch(e){ CANLI.hata=e.message; }
  if(ilk && CANLI.mod==='oyun'){ render(); motorBaslat(); analizEt(); }
}

/* ---------- tahta ---------- */
const TAS = {k:'K',q:'Q',r:'R',b:'B',n:'N',p:'P'};
function fenIzgara(fen){
  const satir=fen.split(' ')[0].split('/'), g=[];
  satir.forEach(r=>{ const s=[]; for(const ch of r){ if(/\d/.test(ch)) for(let i=0;i<+ch;i++) s.push(null); else s.push(ch); } g.push(s); });
  return g;
}
function kareAdi(r,c){ return 'abcdefgh'[c]+(8-r); }
function tahtaHTML(fen, o={}){
  const g=fenIzgara(fen), lm=o.son?[o.son.slice(0,2),o.son.slice(2,4)]:[], sira=fen.split(' ')[1];
  let sah=null;
  if(o.sah){ for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const p=g[r][c]; if(p===(sira==='w'?'K':'k')) sah=kareAdi(r,c);} }
  let h='';
  for(let i=0;i<8;i++) for(let j=0;j<8;j++){
    const r=o.flip?7-i:i, c=o.flip?7-j:j, ad=kareAdi(r,c), p=g[r][c];
    const cls=['bsq',(r+c)%2?'dk':'lt']; if(lm.includes(ad)) cls.push('lm'); if(ad===sah) cls.push('chk');
    if(o.sec===ad) cls.push('sel'); if(o.hedef&&o.hedef.includes(ad)) cls.push(p?'cap':'dot');
    const koord = o.koord ? `${j===0?`<i class="rk">${8-r}</i>`:''}${i===7?`<i class="fl">${'abcdefgh'[c]}</i>`:''}` : '';
    h+=`<div class="${cls.join(' ')}" data-sq="${ad}">${p?`<img src="vendor/pieces/${p===p.toUpperCase()?'w':'b'}${TAS[p.toLowerCase()]}.svg" alt="" draggable="false">`:''}${koord}</div>`;
  }
  return `<div class="board${o.mini?' bmini':''}">${h}</div>`;
}
function aktifRenk(g){ return (g&&g.fen||'').split(' ')[1]==='b' ? 'b' : 'w'; }
function suruyor(g){ return !g.status || g.status==='*'; }
function saatDegeri(g, renk){
  const p=(g.players||[])[renk==='w'?0:1];
  if(!p || p.clock==null) return null;
  let cs=p.clock;
  if(suruyor(g) && renk===aktifRenk(g) && CANLI.saatAn) cs -= (Date.now()-CANLI.saatAn)/10;   // 1 sn = 100 santisaniye
  return Math.max(0, cs);
}
function saatTik(){
  document.querySelectorAll('[data-clk]').forEach(el=>{
    const [gid,renk]=el.dataset.clk.split('|');
    const g=CANLI.oyunlar.find(x=>x.id===gid); if(!g) return;
    const v=saatDegeri(g,renk); if(v==null) return;
    el.textContent=saat(v);
    el.classList.toggle('on', suruyor(g) && renk===aktifRenk(g));
    el.classList.toggle('az', v<6000);
  });
}
function saat(cs){ if(cs==null||cs==='') return ''; let s=typeof cs==='number'?Math.round(cs/100):null;
  if(s==null){ const p=String(cs).split(':').map(Number); s=p.reduce((a,b)=>a*60+b,0); }
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sn=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(sn).padStart(2,'0')}`:`${m}:${String(sn).padStart(2,'0')}`; }
function oyuncuHTML(p, o={}){
  if(!p) return '';
  const tr=p.fed==='TUR';
  const ad = o.kisa ? String(p.name||'?').split(',')[0] : (p.name||'?');
  return `<div class="pl ${o.cls||''}">
    ${p.title?`<span class="ttl">${esc(p.title)}</span>`:''}<span class="pn" title="${esc(p.name||'')}">${esc(ad)}</span>
    ${p.rating?`<span class="pr">${p.rating}</span>`:''}${p.fed?`<span class="fed ${tr?'tr':''}">${tr?flag('TR'):''}${esc(p.fed)}</span>`:''}
    ${o.saat!=null&&o.saat!==''?`<span class="clk ${o.aktif?'on':''}"${o.clkKey?` data-clk="${o.clkKey}"`:''}>${o.saat}</span>`:''}${o.puan!=null?`<span class="pts">${o.puan}</span>`:''}
  </div>`;
}
function sonucPuan(st, beyaz){ if(!st||st==='*') return null; if(st==='1/2-1/2'||st==='½-½') return '½'; return (st==='1-0')===beyaz?'1':'0'; }

/* ---------- motor (Stockfish, tarayıcıda) ---------- */
let MOTOR=null, MOTOR_HAZIR=false, MOTOR_BEKLE=null, MOTOR_FEN=null;
function motorBaslat(){
  if(MOTOR || !CANLI.motorAcik) return;
  try{
    const wasm = typeof WebAssembly==='object' && WebAssembly.validate(Uint8Array.of(0,0x61,0x73,0x6d,1,0,0,0));
    MOTOR = new Worker(wasm?'vendor/stockfish/stockfish.wasm.js':'vendor/stockfish/stockfish.js');
    MOTOR.onmessage = e => motorMesaj(String(e.data));
    MOTOR.postMessage('uci'); MOTOR.postMessage('setoption name MultiPV value 1'); MOTOR.postMessage('isready');
  }catch(e){ MOTOR=null; CANLI.analiz={hata:'Motor başlatılamadı.'}; }
}
function motorDur(){ if(MOTOR){ try{ MOTOR.postMessage('stop'); MOTOR.terminate(); }catch(e){} } MOTOR=null; MOTOR_HAZIR=false; MOTOR_FEN=null; }
function motorMesaj(m){
  if(m==='readyok'){ MOTOR_HAZIR=true; if(MOTOR_BEKLE){ const f=MOTOR_BEKLE; MOTOR_BEKLE=null; motorGit(f); } return; }
  if(!MOTOR_FEN || !m.startsWith('info') || m.indexOf(' pv ')<0) return;
  const d=+(m.match(/ depth (\d+)/)||[])[1], cp=m.match(/ score cp (-?\d+)/), mt=m.match(/ score mate (-?\d+)/);
  const pv=(m.split(' pv ')[1]||'').trim().split(/\s+/);
  const beyaz = MOTOR_FEN.split(' ')[1]==='w' ? 1 : -1;
  CANLI.analiz = {fen:MOTOR_FEN, derinlik:d, cp:cp?beyaz*+cp[1]:null, mat:mt?beyaz*+mt[1]:null, pv};
  analizCiz();
}
function motorGit(fen){ MOTOR_FEN=fen; CANLI.analiz={fen, derinlik:0}; MOTOR.postMessage('position fen '+fen); MOTOR.postMessage('go depth 20'); }
function analizEt(){
  if(!CANLI.motorAcik || CANLI.mod!=='oyun') return;
  motorBaslat(); if(!MOTOR) return;
  const fen=gosterilenFen(); if(!fen || fen===MOTOR_FEN) return;
  MOTOR_FEN=null; MOTOR.postMessage('stop'); MOTOR_BEKLE=fen; MOTOR_HAZIR=false; MOTOR.postMessage('isready');
}
function gosterilenFen(){ if(CANLI.deneme) return CANLI.deneme.fen; const p=CANLI.poz; return p? p.poz[Math.min(CANLI.ply,p.poz.length-1)].fen : null; }
function evalYuzde(a){ if(!a) return 50; if(a.mat!=null) return a.mat>0?100:0; if(a.cp==null) return 50;
  return Math.max(2, Math.min(98, 50+50*(2/(1+Math.exp(-0.0037*a.cp))-1))); }
function evalYazi(a){ if(!a||(a.cp==null&&a.mat==null)) return '…'; if(a.mat!=null) return (a.mat>0?'+':'−')+'M'+Math.abs(a.mat); const v=a.cp/100; return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1); }
function pvSan(fen, pv){
  try{ const c=new Chess(fen); const out=[]; let no=+fen.split(' ')[5], beyaz=fen.split(' ')[1]==='w';
    for(const u of pv.slice(0,10)){ const m=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'}); if(!m) break;
      out.push((beyaz?no+'. ':(out.length?'':no+'... '))+m.san); if(!beyaz) no++; beyaz=!beyaz; }
    return out.join(' ');
  }catch(e){ return ''; }
}
function analizCiz(){
  const a=CANLI.analiz, bar=document.getElementById('evalfill'), yz=document.getElementById('evaltxt'), ln=document.getElementById('evalline');
  if(!bar) return;
  const y=evalYuzde(a); bar.style.height=y+'%';
  if(yz) yz.textContent=evalYazi(a);
  if(ln) ln.innerHTML = a&&a.pv ? `<b>${evalYazi(a)}</b> <span class="dep">derinlik ${a.derinlik}</span> ${esc(pvSan(a.fen,a.pv))}` : (a&&a.hata?esc(a.hata):'Motor düşünüyor…');
}

/* ---------- görünümler ---------- */
function viewCanli(){
  if(CANLI.mod==='tur') return viewCanliTur();
  if(CANLI.mod==='oyun') return viewCanliOyun();
  if(!CANLI.liste && !CANLI.yukleniyor && !CANLI.hata) setTimeout(canliListeGetir,0);
  const kart = x => { const r=turunRaundu(x)||{}, t=x.tour||{};
    return `<button class="bc" data-yayin="${esc(raundUrl(x))}">
      <div class="bc-img">${t.image?`<img src="${esc(t.image)}" alt="" loading="lazy">`:'<span>♟</span>'}</div>
      <div class="bc-body"><div class="bc-meta">${r.ongoing?'<span class="live">CANLI</span>':''}${esc(r.name||'')}${!r.ongoing&&r.startsAt?` · ${new Date(r.startsAt).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`:''}</div>
        <div class="bc-name">${esc(t.name||'')}</div></div></button>`; };
  const L=CANLI.liste;

function canliSaat(renk){
  const P=CANLI.poz, g=CANLI.oyunlar.find(x=>x.id===CANLI.secili)||{};
  if(P && (CANLI.ply < P.poz.length-1 || CANLI.deneme)){   // geçmişteki bir hamlede: o anki PGN saati
    for(let i=Math.min(CANLI.ply,P.poz.length-1);i>0;i--){ const b=(i%2===1)===(P.poz[0].fen.split(' ')[1]==='w'); if((renk==='w')===b && P.poz[i].clk) return saat(P.poz[i].clk); }
    return '';
  }
  return saat(saatDegeri(g,renk));
}
function canliSaatKey(renk){
  const P=CANLI.poz;
  if(P && (CANLI.ply < P.poz.length-1 || CANLI.deneme)) return '';   // geçmişte donuk kalsın
  return `${CANLI.secili}|${renk}`;
}
function buyukTahta(){
  const P=CANLI.poz; if(!P) return tahtaHTML('8/8/8/8/8/8/8/8 w - - 0 1',{koord:true});
  const fen=gosterilenFen();
  const son = CANLI.deneme ? CANLI.deneme.son : P.poz[Math.min(CANLI.ply,P.poz.length-1)].uci;
  let hedef=null;
  if(CANLI.secKare){ try{ hedef=new Chess(fen).moves({square:CANLI.secKare,verbose:true}).map(m=>m.to); }catch(e){} }
  return tahtaHTML(fen,{koord:true,flip:CANLI.flip,son,sah:new Chess(fen).in_check(),sec:CANLI.secKare,hedef});
}
function hamleListesi(ply){
  const P=CANLI.poz; if(!P) return '<div class="hint">Hamleler yükleniyor…</div>';
  const beyazBasliyor=P.poz[0].fen.split(' ')[1]==='w'; let no=+P.poz[0].fen.split(' ')[5]||1, h='';
  for(let i=1;i<P.poz.length;i++){
    const beyaz=(i%2===1)===beyazBasliyor;
    if(beyaz||i===1) h+=`<span class="mn">${no}.${beyaz?'':'..'}</span>`;
    h+=`<button class="mv ${i===ply&&!CANLI.deneme?'on':''}" data-ply="${i}">${esc(P.poz[i].san)}</button>`;
    if(!beyaz) no++;
  }
  return (h||'<div class="hint">Henüz hamle yok.</div>')+(P.sonuc&&P.sonuc!=='*'?`<div class="res">${esc(P.sonuc)}</div>`:'');
}

  const bb=document.getElementById('bigboard'); if(!bb) return render();

function plyGit(x){
  const P=CANLI.poz; if(!P) return; const n=P.poz.length-1;
  CANLI.deneme=null; CANLI.secKare=null;
  CANLI.ply = x==='+1'?Math.min(n,CANLI.ply+1) : x==='-1'?Math.max(0,CANLI.ply-1) : Math.max(0,Math.min(n,+x));
  CANLI.takip = CANLI.ply===n;
  const t=document.getElementById('takip'); if(t) t.setAttribute('aria-pressed',CANLI.takip);
  const dn=document.querySelector('.deneme'); if(dn){ render(); analizEt(); return; }
  canliOyunCiz(); analizEt();
}
function kareTikla(sq){
  const fen=gosterilenFen(); if(!fen) return;
  const c=new Chess(fen);
  if(CANLI.secKare){
    const m=c.move({from:CANLI.secKare,to:sq,promotion:'q'});
    if(m){ const d=CANLI.deneme||{hamleler:[]}; CANLI.deneme={fen:c.fen(), son:m.from+m.to, hamleler:[...d.hamleler, m.san]}; CANLI.secKare=null; CANLI.takip=false; render(); analizEt(); return; }
  }
  const p=c.get(sq); CANLI.secKare = p && p.color===c.turn() && CANLI.secKare!==sq ? sq : null;
  canliOyunCiz();
}

  if(q('motorac')) q('motorac').onchange=e=>{ CANLI.motorAcik=e.target.checked; if(CANLI.motorAcik){ analizEt(); } else { motorDur(); CANLI.analiz=null; analizCiz(); const l=q('evalline'); if(l) l.textContent='Kapalı'; } };
  if(q('denemecik')) q('denemecik').onclick=()=>{ CANLI.deneme=null; CANLI.secKare=null; render(); analizEt(); };

document.addEventListener('keydown',e=>{
  if(state.view!=='canli'||CANLI.mod!=='oyun'||/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||''))) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); plyGit('-1'); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); plyGit('+1'); }
  else if(e.key==='Home'){ plyGit(0); } else if(e.key==='End'){ plyGit(99999); }
  else if(e.key==='f'){ CANLI.flip=!CANLI.flip; canliOyunCiz(); }
});

  else if(state.view==='calc'){app.innerHTML=viewCalc(); bindCalc(); return;}
  else if(state.view==='canli'){ app.innerHTML=viewCanli(); bindCommon(); bindCanli(); return; }
  else if(state.view==='arsiv') app.innerHTML=viewArsiv();
  else if(state.view==='yeni') app.innerHTML=viewYeni();
  else { app.innerHTML=viewSources(); }
  bindCommon();
}
render();
fetch('data/turnuvalar.json',{cache:'no-store'})
  .then(r=>r.ok?r.json():null)
  .then(v=>{ if(veriyiUygula(v)){ ziyaretHesapla(); render(); } })
  .catch(()=>{});
</script>
